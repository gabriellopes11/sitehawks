{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Rondonópolis Hawks</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand text-white fw-bold" href="/">
            RONDONÓPOLIS <span class="highlight">HAWKS</span>
        </a>
    </div>
</nav>

{% block content %}
{% endblock %}

<footer class="text-center py-5 mt-5">
    <div class="container">
        <div class="mb-4">
            <h5 class="fw-bold">RONDONÓPOLIS <span class="highlight">HAWKS</span></h5>
            <p class="text-muted small">FORÇA • GARRA • TRADIÇÃO</p>
        </div>
        <div class="border-top pt-4 opacity-50">
            <p class="small mb-0">© 2026 Rondonópolis Hawks - Todos os direitos reservados.</p>
        </div>
    </div>
</footer>

<!-- SCRIPT NO FINAL -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const counters = document.querySelectorAll('.counter');

    counters.forEach(counter => {
        counter.innerText = '0';

        const updateCounter = () => {
            const target = +counter.getAttribute('data-target');
            const c = +counter.innerText;
            const increment = target / 100;

            if(c < target) {
                counter.innerText = `${Math.ceil(c + increment)}`;
                setTimeout(updateCounter, 20);
            } else {
                counter.innerText = target;
            }
        };

        updateCounter();
    });
});
</script>

</body>
</html>
